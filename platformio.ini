[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_flags = 
    -DBOARD_HAS_PSRAM 
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
monitor_speed = 115200

lib_deps = 
    ; Correct khoih-prog async WiFiManager (no WebServer.h conflict)
    https://github.com/khoih-prog/ESPAsync_WiFiManager.git

    ; Your async stack (me-no-dev is stable/classic)
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

    ; ElegantOTA
    ayushsharma82/ElegantOTA@^3.1.0

lib_ignore = 
    WebServer               ; blocks any sync WebServer include attempts